spring.application.name=Estrela
spring.datasource.url=jdbc:postgresql://localhost:5432/estrela
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

taskgo.jwt.secret=${TASKGO_JWT_SECRET:troque-este-segredo-em-producao-taskgo-jwt-secret-key-32bytes}
taskgo.jwt.expiracao-minutos=120

taskgo.admin.bootstrap-email=${TASKGO_ADMIN_EMAIL:admin@taskgo.com}
taskgo.admin.bootstrap-senha=${TASKGO_ADMIN_SENHA:admin123}

taskgo.storage.kyc-dir=./storage/kyc
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Raio padrão de busca por geolocalização (US-03) vive em parametro_negocio (chave busca.raio-padrao-km),
# não aqui, para que seja ajustável pelo admin sem deploy — ver ParametroNegocioService.
