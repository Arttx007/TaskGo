# Sobrescreve src/main/resources/application.properties para os testes: H2 em memória, schema
# gerado pelo próprio Hibernate a partir das entidades (sem depender de rodar as migrations do
# Flyway, que o slice @DataJpaTest não executa por padrão).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

taskgo.jwt.secret=segredo-de-teste-com-pelo-menos-32-bytes-de-tamanho
taskgo.jwt.expiracao-minutos=120

taskgo.admin.bootstrap-email=admin@taskgo.com
taskgo.admin.bootstrap-senha=admin123

taskgo.storage.kyc-dir=./target/test-storage/kyc
